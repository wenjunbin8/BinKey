# ============================================================
# BinKey 配置文件  (UTF-8)
# 单键急停 / SOCD / 动态键程(DKS) 规则
#
# 键名写法：
#   单个字符: A B C 1 2 ...        特殊键: Space Enter Tab Esc Left Right Up Down
#             LShift RShift LCtrl RCtrl LAlt RAlt Caps Comma Period Minus Equals
#             F1..F12 Home End PageUp PageDown Backspace Insert
#   或虚拟键码数字: 65 (=A)
# 以 # 或 ; 开始的行是注释，行内 # 之后的内容也被忽略。
# ============================================================

# ---------- 全局 ----------
debug        = 0          # 1 = 把每个按键事件和注入动作写入 BinKey.log，便于排错
autostart    = 0          # 1 = 开机自动启动（写入注册表 Run 键）
# toggle_key = F1        # 全局热键，按下切换 DKS/SOCD 开/关（默认不启用）

# ---------- SOCD（Snap Tap）----------
socd = 1
group = A D mode=snap     # 按住 A 再按 D：A 自动释放，D 生效（后输入优先）
group = W S mode=snap
# 恢复行为：A 被 snap 释放后仍物理按着，此时松开 D，A 会自动重新生效。
#           反向同理（先按 D 再按 A，松开 A 后 D 重新生效）。
# 可选 mode: snap(后输入优先) | first(先输入优先) | neutral(同按则都取消)
#            dominant(指定键优先) | off
# 例：group = A D mode=dominant dominant=A

# ---------- DKS 规则 ----------
dks = 1
# 语法: rule = key=<触发键> on=<press|release|hold|repeat> tap=<目标键>
#              tap_ms=<按下时长> delay_ms=<触发后延时> min_hold_ms=<按住多久才算>
#              interval_ms=<repeat 间隔> count=<repeat 次数, 0=无限> cond=<条件>
#
# cond 条件:
#   always      每次按下/松手都触发
#   active      只有触发键此刻仍是"有效输入"（没有被同组覆盖）才触发 —— 推荐
#   target_up   只有目标键没有被按住才触发
#   target_free 目标键既没被按住也没处于按下状态才触发

# 单键急停（无畏契约 / CS 类）：松开移动键时，自动轻点反向键 25 ms
rule = key=A on=release tap=D tap_ms=25 min_hold_ms=40 cond=active
rule = key=D on=release tap=A tap_ms=25 min_hold_ms=40 cond=active
rule = key=W on=release tap=S tap_ms=20 min_hold_ms=40 cond=active
rule = key=S on=release tap=W tap_ms=20 min_hold_ms=40 cond=active

# ---- 其它示例（需要时取消注释） ----
# 按下 A 的瞬间轻点 Shift（二段触发）
# rule = key=A on=press tap=LShift tap_ms=10 cond=target_free
# 按住 A 超过 300 ms 触发一次右键
# rule = key=A on=hold tap=Right tap_ms=30 min_hold_ms=300
# 按住 A 期间每 120 ms 轻点 Q 一次（连发/turbo）
# rule = key=A on=repeat tap=Q tap_ms=25 interval_ms=120 min_hold_ms=200 count=0
enabled = 1
