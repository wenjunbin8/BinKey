# 方案 C：单键急停 + Snap Tap 混用（更激进）
# 同向键互相覆盖（后按的优先），同时松手时轻点反向键
debug = 0
socd = 1
group = A D mode=snap
group = W S mode=snap
dks = 1

rule = key=A on=release tap=D tap_ms=18 min_hold_ms=30 cond=active
rule = key=D on=release tap=A tap_ms=18 min_hold_ms=30 cond=active
rule = key=W on=release tap=S tap_ms=15 min_hold_ms=30 cond=active
rule = key=S on=release tap=W tap_ms=15 min_hold_ms=30 cond=active

# 如果想"某键永远优先"，用 dominant：
# group = A D mode=dominant dominant=D
