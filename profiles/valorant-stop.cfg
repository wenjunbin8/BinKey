# 方案 A：单键急停（松手派）—— 只做 DKS，不做 SOCD，最稳
# 适用：无畏契约 / 多数现代 FPS
debug = 0
socd = 0
dks = 1

# 松开移动键时自动轻点反向键，实现"松手即停"
rule = key=A on=release tap=D tap_ms=25 min_hold_ms=40 cond=active
rule = key=D on=release tap=A tap_ms=25 min_hold_ms=40 cond=active
rule = key=W on=release tap=S tap_ms=20 min_hold_ms=40 cond=active
rule = key=S on=release tap=W tap_ms=20 min_hold_ms=40 cond=active
